name: Build HTML to iOS IPA

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "App name"
        required: true
        default: "MyHTMLApp"

      html_file:
        description: "HTML file"
        required: true
        default: "second.html"

      package_id:
        description: "Bundle Identifier"
        required: true
        default: "com.hiroki.myhtmlapp"

jobs:
  build:
    runs-on: macos-latest

    steps:

      # ============================================================
      # Checkout
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # Node.js
      # ============================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ============================================================
      # Variables
      # ============================================================
      - name: Set variables
        shell: bash
        run: |
          set -e

          echo "APP_NAME=${{ github.event.inputs.app_name }}" >> "$GITHUB_ENV"
          echo "HTML_FILE=${{ github.event.inputs.html_file }}" >> "$GITHUB_ENV"
          echo "PACKAGE_ID=${{ github.event.inputs.package_id }}" >> "$GITHUB_ENV"

          echo "================================"
          echo "App       : ${{ github.event.inputs.app_name }}"
          echo "HTML      : ${{ github.event.inputs.html_file }}"
          echo "Bundle ID : ${{ github.event.inputs.package_id }}"
          echo "================================"

      # ============================================================
      # Check HTML
      # ============================================================
      - name: Check HTML
        shell: bash
        run: |
          set -e

          if [ ! -f "$HTML_FILE" ]; then
            echo "ERROR: HTML file not found:"
            echo "$HTML_FILE"
            echo
            echo "Available HTML files:"
            find . \
              -type f \
              -name "*.html" \
              -not -path "./.git/*" \
              -not -path "./node_modules/*" \
              | sort

            exit 1
          fi

          echo "Found HTML:"
          realpath "$HTML_FILE"

      # ============================================================
      # Install Capacitor 7
      # ============================================================
      - name: Install Capacitor
        shell: bash
        run: |
          set -e

          if [ ! -f package.json ]; then
            npm init -y
          fi

          npm install \
            @capacitor/core@7 \
            @capacitor/cli@7 \
            @capacitor/ios@7

          echo
          echo "Capacitor versions:"
          npm list @capacitor/core @capacitor/cli @capacitor/ios

      # ============================================================
      # Prepare www
      # ============================================================
      - name: Prepare web files
        shell: bash
        run: |
          set -e

          rm -rf www
          mkdir -p www

          HTML_DIR="$(dirname "$HTML_FILE")"

          echo "HTML directory:"
          echo "$HTML_DIR"

          if [ "$HTML_DIR" = "." ]; then

            echo "HTML is in repository root."

            rsync -a \
              --exclude=".git/" \
              --exclude=".github/" \
              --exclude="node_modules/" \
              --exclude="ios/" \
              --exclude="www/" \
              --exclude="package.json" \
              --exclude="package-lock.json" \
              --exclude="yarn.lock" \
              --exclude="pnpm-lock.yaml" \
              --exclude="capacitor.config.json" \
              --exclude="capacitor.config.ts" \
              --exclude="index.js" \
              --exclude="server.js" \
              --exclude="server.mjs" \
              --exclude="server.cjs" \
              . www/

          else

            echo "HTML is inside a subdirectory."

            rsync -a \
              --exclude="node_modules/" \
              --exclude=".git/" \
              "$HTML_DIR/" www/

          fi

          # 指定HTMLをアプリのindex.htmlにする
          cp "$HTML_FILE" www/index.html

          echo
          echo "================================"
          echo "WWW FILES"
          echo "================================"

          find www -maxdepth 3 -type f | sort

          # node_modulesが入っていないことを確認
          if [ -d "www/node_modules" ]; then
            echo "ERROR: node_modules exists in www!"
            exit 1
          fi

      # ============================================================
      # Initialize Capacitor
      # ============================================================
      - name: Initialize Capacitor
        shell: bash
        run: |
          set -e

          rm -f capacitor.config.json
          rm -f capacitor.config.ts

          npx cap init \
            "$APP_NAME" \
            "$PACKAGE_ID" \
            --web-dir=www

      # ============================================================
      # Add iOS
      # ============================================================
      - name: Add iOS
        shell: bash
        run: |
          set -e

          rm -rf ios

          npx cap add ios

      # ============================================================
      # IMPORTANT:
      # Podfileをcap syncより前に修正する
      # ============================================================
      - name: Configure iOS deployment target
        shell: bash
        run: |
          set -e

          PODFILE="ios/App/Podfile"

          echo "================================"
          echo "Original Podfile"
          echo "================================"

          cat "$PODFILE"

          echo
          echo "================================"
          echo "Setting iOS 14.0"
          echo "================================"

          python3 - <<'PY'
          from pathlib import Path

          path = Path("ios/App/Podfile")
          text = path.read_text()

          lines = text.splitlines()

          found = False

          for i, line in enumerate(lines):
              if line.strip().startswith("platform :ios"):
                  lines[i] = "platform :ios, '14.0'"
                  found = True
                  break

          if not found:
              lines.insert(0, "platform :ios, '14.0'")

          path.write_text("\n".join(lines) + "\n")
          PY

          echo
          cat "$PODFILE"

      # ============================================================
      # Modify Xcode deployment target
      # ============================================================
      - name: Configure Xcode
        shell: bash
        run: |
          set -e

          find ios/App \
            -name "*.pbxproj" \
            -type f \
            -print \
            -exec sed -i '' \
            's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*/IPHONEOS_DEPLOYMENT_TARGET = 14.0/g' \
            {} \;

          echo
          echo "Deployment targets:"
          grep -R \
            "IPHONEOS_DEPLOYMENT_TARGET" \
            ios/App \
            --include="*.pbxproj" \
            || true

      # ============================================================
      # Install CocoaPods
      # ============================================================
      - name: Install CocoaPods
        shell: bash
        run: |
          set -e

          cd ios/App

          pod install --repo-update

      # ============================================================
      # Sync Capacitor
      # ============================================================
      - name: Sync Capacitor
        shell: bash
        run: |
          set -e

          npx cap sync ios

      # ============================================================
      # Re-apply deployment target after sync
      # ============================================================
      - name: Reapply deployment target
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          path = Path("ios/App/Podfile")

          if path.exists():
              text = path.read_text()

              lines = text.splitlines()

              found = False

              for i, line in enumerate(lines):
                  if line.strip().startswith("platform :ios"):
                      lines[i] = "platform :ios, '14.0'"
                      found = True
                      break

              if not found:
                  lines.insert(0, "platform :ios, '14.0'")

              path.write_text("\n".join(lines) + "\n")
          PY

          find ios/App \
            -name "*.pbxproj" \
            -type f \
            -exec sed -i '' \
            's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*/IPHONEOS_DEPLOYMENT_TARGET = 14.0/g' \
            {} \;

          cd ios/App

          pod install

      # ============================================================
      # Build
      # ============================================================
      - name: Build iOS app
        shell: bash
        run: |
          set -e

          cd ios/App

          rm -rf build

          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath "$PWD/build/App.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            archive

      # ============================================================
      # Verify .app
      # ============================================================
      - name: Verify app
        shell: bash
        run: |
          set -e

          APP_PATH="ios/App/build/App.xcarchive/Products/Applications/App.app"

          echo "================================"
          echo "APP PATH"
          echo "================================"

          echo "$APP_PATH"

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: App.app not found!"
            exit 1
          fi

          # Info.plist
          if [ ! -f "$APP_PATH/Info.plist" ]; then
            echo "ERROR: Info.plist missing!"
            exit 1
          fi

          # Executable
          EXECUTABLE=$(
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleExecutable" \
              "$APP_PATH/Info.plist"
          )

          echo "Executable:"
          echo "$EXECUTABLE"

          if [ ! -f "$APP_PATH/$EXECUTABLE" ]; then
            echo "ERROR: Executable missing!"
            exit 1
          fi

          # Bundle ID
          BUNDLE_ID=$(
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleIdentifier" \
              "$APP_PATH/Info.plist"
          )

          echo "Bundle ID:"
          echo "$BUNDLE_ID"

          if [ "$BUNDLE_ID" != "$PACKAGE_ID" ]; then
            echo "ERROR: Bundle ID mismatch!"
            echo "Expected: $PACKAGE_ID"
            echo "Actual:   $BUNDLE_ID"
            exit 1
          fi

          # Architecture
          echo
          echo "Architecture:"
          lipo -info "$APP_PATH/$EXECUTABLE"

          # Web assets
          if [ ! -f "$APP_PATH/public/index.html" ]; then
            echo "ERROR: public/index.html missing!"
            exit 1
          fi

          echo
          echo "================================"
          echo "APP VERIFICATION OK"
          echo "================================"

      # ============================================================
      # Create IPA
      # ============================================================
      - name: Create IPA
        shell: bash
        run: |
          set -e

          APP_PATH="ios/App/build/App.xcarchive/Products/Applications/App.app"

          rm -rf Payload

          mkdir -p Payload

          cp -R "$APP_PATH" Payload/App.app

          rm -f "$APP_NAME.ipa"

          zip -qry "$APP_NAME.ipa" Payload

          echo
          echo "================================"
          echo "IPA CREATED"
          echo "================================"

          ls -lh "$APP_NAME.ipa"

      # ============================================================
      # Verify IPA
      # ============================================================
      - name: Verify IPA
        shell: bash
        run: |
          set -e

          echo "================================"
          echo "IPA CONTENTS"
          echo "================================"

          unzip -l "$APP_NAME.ipa"

          echo
          echo "Checking Info.plist..."

          unzip -l "$APP_NAME.ipa" \
            | grep -q "Payload/App.app/Info.plist"

          echo
          echo "IPA verification OK!"

      # ============================================================
      # SHA256
      # ============================================================
      - name: SHA256
        shell: bash
        run: |
          shasum -a 256 "$APP_NAME.ipa"

      # ============================================================
      # Upload
      # ============================================================
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.app_name }}-IPA
          path: ${{ github.event.inputs.app_name }}.ipa
          if-no-files-found: error
