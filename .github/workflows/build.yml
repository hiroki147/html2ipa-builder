name: Build HTML to iOS IPA

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "App name"
        required: true
        default: "MyHTMLApp"

      html_file:
        description: "HTML file"
        required: true
        default: "second.html"

      package_id:
        description: "Bundle Identifier"
        required: true
        default: "com.hiroki.myhtmlapp"

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Set variables
        shell: bash
        run: |
          set -e

          echo "APP_NAME=${{ github.event.inputs.app_name }}" >> "$GITHUB_ENV"
          echo "HTML_FILE=${{ github.event.inputs.html_file }}" >> "$GITHUB_ENV"
          echo "PACKAGE_ID=${{ github.event.inputs.package_id }}" >> "$GITHUB_ENV"

      - name: Check HTML
        shell: bash
        run: |
          set -e

          echo "HTML: $HTML_FILE"

          if [ ! -f "$HTML_FILE" ]; then
            echo "ERROR: HTML file not found!"
            echo
            find . -type f -name "*.html" \
              -not -path "./.git/*" \
              -not -path "./node_modules/*"
            exit 1
          fi

      - name: Install Capacitor
        shell: bash
        run: |
          set -e

          if [ ! -f package.json ]; then
            npm init -y
          fi

          npm install @capacitor/core @capacitor/cli @capacitor/ios

      - name: Prepare web files
        shell: bash
        run: |
          set -e

          rm -rf www
          mkdir -p www

          HTML_DIR="$(dirname "$HTML_FILE")"

          echo "HTML directory: $HTML_DIR"

          if [ "$HTML_DIR" = "." ]; then

            echo "HTML is in repository root."

            rsync -a \
              --exclude=".git/" \
              --exclude=".github/" \
              --exclude="node_modules/" \
              --exclude="ios/" \
              --exclude="www/" \
              --exclude="package.json" \
              --exclude="package-lock.json" \
              --exclude="yarn.lock" \
              --exclude="pnpm-lock.yaml" \
              --exclude="capacitor.config.json" \
              --exclude="capacitor.config.ts" \
              --exclude="index.js" \
              --exclude="server.js" \
              . www/

          else

            echo "HTML is inside a subdirectory."

            rsync -a \
              --exclude="node_modules/" \
              --exclude=".git/" \
              "$HTML_DIR/" www/

          fi

          cp "$HTML_FILE" www/index.html

          echo
          echo "===== WWW ====="

          find www -maxdepth 3 -type f | sort

          echo
          echo "===== INDEX ====="

          head -30 www/index.html

          if [ -d www/node_modules ]; then
            echo "ERROR: node_modules detected in www!"
            exit 1
          fi

      - name: Initialize Capacitor
        shell: bash
        run: |
          set -e

          npx cap init \
            "$APP_NAME" \
            "$PACKAGE_ID" \
            --web-dir=www

      - name: Add iOS
        shell: bash
        run: |
          set -e

          npx cap add ios

      - name: Sync Capacitor
        shell: bash
        run: |
          set -e

          npx cap sync ios

      - name: Set deployment target
        shell: bash
        run: |
          set -e

          cd ios/App

          if grep -q "platform :ios" Podfile; then
            sed -i '' "s/platform :ios, '[^']*'/platform :ios, '14.0'/" Podfile
          else
            sed -i '' "1s/^/platform :ios, '14.0'\n/" Podfile
          fi

          find . -name "*.pbxproj" -type f -exec \
            sed -i '' \
            "s/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*/IPHONEOS_DEPLOYMENT_TARGET = 14.0/g" \
            {} \;

      - name: Install CocoaPods
        shell: bash
        run: |
          set -e

          cd ios/App

          pod install

      - name: Build iOS app
        shell: bash
        run: |
          set -e

          cd ios/App

          rm -rf build

          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath "$PWD/build/App.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Verify app
        shell: bash
        run: |
          set -e

          APP_PATH="ios/App/build/App.xcarchive/Products/Applications/App.app"

          echo "Checking:"
          echo "$APP_PATH"

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: App.app not found!"
            exit 1
          fi

          if [ ! -f "$APP_PATH/Info.plist" ]; then
            echo "ERROR: Info.plist not found!"
            exit 1
          fi

          EXECUTABLE=$(
            /usr/libexec/PlistBuddy \
            -c "Print :CFBundleExecutable" \
            "$APP_PATH/Info.plist"
          )

          echo "Executable: $EXECUTABLE"

          if [ ! -f "$APP_PATH/$EXECUTABLE" ]; then
            echo "ERROR: Executable not found!"
            exit 1
          fi

          BUNDLE_ID=$(
            /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIdentifier" \
            "$APP_PATH/Info.plist"
          )

          echo "Bundle ID: $BUNDLE_ID"

          if [ "$BUNDLE_ID" != "$PACKAGE_ID" ]; then
            echo "ERROR: Bundle ID mismatch!"
            exit 1
          fi

          echo
          echo "Architecture:"
          lipo -info "$APP_PATH/$EXECUTABLE"

          echo
          echo "App verification OK!"

      - name: Create IPA
        shell: bash
        run: |
          set -e

          APP_PATH="ios/App/build/App.xcarchive/Products/Applications/App.app"

          rm -rf Payload

          mkdir Payload

          cp -R "$APP_PATH" Payload/App.app

          rm -f "$APP_NAME.ipa"

          zip -qry "$APP_NAME.ipa" Payload

          echo
          echo "IPA created:"
          ls -lh "$APP_NAME.ipa"

      - name: Verify IPA
        shell: bash
        run: |
          set -e

          echo "===== IPA CONTENTS ====="

          unzip -l "$APP_NAME.ipa"

          echo
          echo "Checking Payload/App.app..."

          unzip -l "$APP_NAME.ipa" | grep "Payload/App.app/Info.plist"

          echo
          echo "IPA verification OK!"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.app_name }}-IPA
          path: ${{ github.event.inputs.app_name }}.ipa
          if-no-files-found: error

      - name: SHA256
        shell: bash
        run: |
          shasum -a 256 "$APP_NAME.ipa"
